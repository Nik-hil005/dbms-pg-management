services:
  - type: web
    name: rentez
    runtime: python
    rootDir: rentez-backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn rentez_backend.wsgi:application
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DB_ENGINE
        value: django.db.backends.postgresql
      - key: DATABASE_URL
        fromDatabase:
          name: rentez-db
          property: connectionString

databases:
  - name: rentez-db
    databaseName: rentez_db
    user: rentez_user
